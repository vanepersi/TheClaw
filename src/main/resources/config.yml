# TheClaw — two-player claw machine arcade

# Default round length in seconds (override per arena)
default-duration-seconds: 90

# Points awarded when a prize is successfully dropped in the chute
default-prize-points: 15

# Bonus points when every prize is collected before time runs out
default-clear-bonus-points: 25

# Optional entry fee charged on join (Vault when available)
entry-fee: 0.0

# How far the claw moves per joystick click (blocks)
move-step: 0.45

# How far raise/lower moves the claw on Y (blocks)
vertical-step: 0.35

# Distance from claw player to a prize required to attempt a grab
grab-radius: 1.15

# Base chance (0.0–1.0) that a grab sticks — real claw machines are stingy
grab-success-chance: 0.38

# Extra chance when fully lowered near the floor of the play bounds
grab-lowered-bonus: 0.18

# Chance per move tick that a held prize slips free (0 = never)
slip-chance-while-moving: 0.12

# Distance from drop chute center to count as a successful drop
drop-radius: 1.4

# Y threshold: claw is "lowered" when at or below raised-y minus this amount
lowered-threshold: 1.25

# Return players to lobby when the round ends
teleport-on-end: true

# Clear control / grab items when the round ends
clear-items-on-end: true

# ---------------------------------------------------------------------------
# Custom models / textures
# Works with vanilla item models, ItemsAdder, ModelEngine resource packs, etc.
# Set item-model to a namespaced key from your pack, e.g. "genesicore:prize_duck"
# Leave blank to use only material + custom-model-data.
# ---------------------------------------------------------------------------
prize:
  material: PLAYER_HEAD
  item-model: ""
  custom-model-data: 0
  display-name: "&dArcade Prize"
  itemsadder-id: ""
  scale: 1.0
  y-offset: 0.0

controls:
  move-north:
    material: LIME_DYE
    item-model: ""
    custom-model-data: 0
    display-name: "&aMove Forward"
    lore:
      - "&7Nudge the claw forward"
    itemsadder-id: ""
  move-south:
    material: LIME_DYE
    item-model: ""
    custom-model-data: 0
    display-name: "&aMove Back"
    lore:
      - "&7Nudge the claw backward"
    itemsadder-id: ""
  move-west:
    material: LIME_DYE
    item-model: ""
    custom-model-data: 0
    display-name: "&aMove Left"
    lore:
      - "&7Nudge the claw left"
    itemsadder-id: ""
  move-east:
    material: LIME_DYE
    item-model: ""
    custom-model-data: 0
    display-name: "&aMove Right"
    lore:
      - "&7Nudge the claw right"
    itemsadder-id: ""
  lower:
    material: ORANGE_DYE
    item-model: ""
    custom-model-data: 0
    display-name: "&6Lower Claw"
    lore:
      - "&7Drop the claw toward the prizes"
    itemsadder-id: ""
  raise:
    material: LIGHT_BLUE_DYE
    item-model: ""
    custom-model-data: 0
    display-name: "&bRaise Claw"
    lore:
      - "&7Lift the claw back up"
    itemsadder-id: ""

grab:
  material: TRIPWIRE_HOOK
  item-model: ""
  custom-model-data: 0
  display-name: "&eGrab!"
  lore:
    - "&7Right-click to clamp onto a prize"
    - "&7Works best when the claw is lowered"
  itemsadder-id: ""

# ---------------------------------------------------------------------------
# Rewards
# Arcade points are always stored in points.yml for desk redemption.
# Optionally also deposit into Vault and/or run console commands.
# ---------------------------------------------------------------------------
reward:
  deposit-to-vault: false
  # Placeholders: {player} {uuid} {points} {arena} {prizes}
  commands: []


# TheClaw — click-to-join human claw machine

# Guide phase length before the claw drops
default-duration-seconds: 35

# Extra seconds to reach the drop chute after a successful grab
deliver-seconds: 25

default-prize-points: 15
default-clear-bonus-points: 25
entry-fee: 0.0

# Title countdown before the round
countdown-seconds: 3

# How far the operator may wander from the machine (blocks)
operator-max-distance: 6.0

# Seconds to return to the control pad before the game ends
off-pad-grace-seconds: 10

# Signal spam protection
signal-cooldown-millis: 350

# Claw drop windup before the sync number appears
drop-windup-ticks: 30

# How long both players have to press the hotbar number (ticks)
sync-window-ticks: 60

# false = pressing correctly+fast makes the claw FAIL (real-machine feel / "you lose")
# true  = pressing correctly+fast makes the grab succeed
sync-success-means-grab: false

grab-radius: 1.35
drop-radius: 1.4

# Scale applied to the human claw player (Attribute.SCALE)
claw-scale: 0.55
claw-walk-speed: 0.16

